name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node runs the TypeScript tests directly, so the version matters:
      # native type stripping is only unflagged from 23.6 onward.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # No secrets needed: the Azure client is constructed per request, so a
      # build never touches the credentials.
      - run: npm run build
