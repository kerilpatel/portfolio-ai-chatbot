name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Advisories appear without anyone touching the code. The Next.js critical
  # that shipped here for weeks was found by chance, not by a check.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node runs the TypeScript tests directly, so the version matters:
      # native type stripping is only unflagged from 23.6 onward.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails the build only for what actually ships. Dev-tooling advisories
      # are reported in the next step without blocking: a DoS in the lint
      # toolchain's glob parser is not worth a red build, while the same
      # severity in a runtime dependency is.
      - name: Audit shipping dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational, so dev-dependency advisories stay visible rather than
      # silently accumulating behind the gate above.
      - name: Audit all dependencies (advisory only)
        run: npm audit || true

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # No secrets needed: the Azure client is constructed per request, so a
      # build never touches the credentials.
      - run: npm run build

      # Boots the app and asserts every documented status code. Needs no
      # credentials - the upstream call is expected to fail, and what this
      # covers is every guard in front of it.
      - run: npm run smoke
