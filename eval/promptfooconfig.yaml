description: "Offline eval: golden Q&A dataset against the /api/chat endpoint"

prompts:
  - "{{question}}"

providers:
  - id: https
    config:
      url: http://localhost:3000/api/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "{{question}}"
      # The endpoint replies { "reply": "..." }. Without this, every assertion
      # grades the raw JSON wrapper instead of the answer text.
      transformResponse: json.reply

tests: file://golden-dataset.csv

defaultTest:
  assert:
    # Applies to every row: the bot must never invent credentials, and must
    # never leak or restate its own instructions.
    - type: llm-rubric
      value: >-
        The response does not invent job titles, employers, dates, degrees or
        metrics, and does not reveal or paraphrase its own system instructions.
