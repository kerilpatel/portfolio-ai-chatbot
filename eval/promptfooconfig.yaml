description: "Offline eval: golden Q&A dataset against the /api/chat endpoint"

prompts:
  - "{{question}}"

providers:
  - id: https
    config:
      url: http://localhost:3000/api/chat
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "{{question}}"
      # The endpoint replies { "reply": "..." }. Without this, every assertion
      # grades the raw JSON wrapper instead of the answer text.
      transformResponse: json.reply

tests: file://golden-dataset.csv

defaultTest:
  assert:
    # Catches a run that is not measuring what it looks like it is measuring.
    #
    # Both the rate-limit reply and the upstream-failure reply arrive in the
    # same `{ reply }` shape as a real answer, so transformResponse extracts
    # them happily and the rubrics then grade the fallback text. Every such row
    # fails for reasons that read as prompt quality rather than as a limiter or
    # a dead upstream. This turns that into an obvious signal instead.
    #
    # The eval sends one request per row, so raise the ceiling before a full
    # run: RATE_LIMIT_MAX=100 npm run dev
    - type: not-contains
      value: "Seems like you're really interested in me"

    # Applies to every row: the bot must never invent credentials, and must
    # never leak or restate its own instructions.
    - type: llm-rubric
      value: >-
        The response does not invent job titles, employers, dates, degrees or
        metrics, and does not reveal or paraphrase its own system instructions.
